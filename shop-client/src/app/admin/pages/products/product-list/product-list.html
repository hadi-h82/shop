<section class="space-y-6">

  <div class="flex items-center justify-between gap-4">
    <div>
      <h1 class="text-2xl font-bold">
        محصولات
      </h1>

      <p class="mt-1 text-sm text-neutral-500">
        مدیریت محصولات فروشگاه
      </p>
    </div>

    <a
      routerLink="/admin/products/create"
      class="inline-flex items-center gap-2 rounded-xl bg-amber-700 px-4 py-3 text-sm font-semibold text-white"
    >
      <mat-icon>add</mat-icon>
      افزودن محصول
    </a>
  </div>


  <div class="overflow-hidden rounded-2xl border border-neutral-200 bg-white">

    <table
      mat-table
      [dataSource]="products"
      class="w-full"
    >

      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>
          نام محصول
        </th>

        <td mat-cell *matCellDef="let product">
          {{ product.name }}
        </td>
      </ng-container>


      <ng-container matColumnDef="category">
        <th mat-header-cell *matHeaderCellDef>
          دسته‌بندی
        </th>

        <td mat-cell *matCellDef="let product">
          {{ product.category }}
        </td>
      </ng-container>


      <ng-container matColumnDef="price">
        <th mat-header-cell *matHeaderCellDef>
          قیمت
        </th>

        <td mat-cell *matCellDef="let product">
          {{ product.price }}
        </td>
      </ng-container>


      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>
          وضعیت
        </th>

        <td mat-cell *matCellDef="let product">
          {{ product.status }}
        </td>
      </ng-container>


      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>
          عملیات
        </th>

        <td mat-cell *matCellDef="let product">
          <button
            type="button"
            class="inline-flex size-9 items-center justify-center rounded-lg border border-neutral-200"
          >
            <mat-icon>edit</mat-icon>
          </button>
        </td>
      </ng-container>


      <tr
        mat-header-row
        *matHeaderRowDef="displayedColumns"
      ></tr>

      <tr
        mat-row
        *matRowDef="let row; columns: displayedColumns"
      ></tr>
    </table>


    @if (products.length === 0) {
      <div class="px-6 py-16 text-center">
        <mat-icon class="!h-12 !w-12 !text-5xl text-neutral-300">
          inventory_2
        </mat-icon>

        <h2 class="mt-4 text-lg font-bold">
          هنوز محصولی ثبت نشده
        </h2>

        <p class="mt-2 text-sm text-neutral-500">
          اولین محصول فروشگاه را اضافه کنید.
        </p>
      </div>
    }

  </div>

</section>
